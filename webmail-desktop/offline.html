<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>JARVIS Mail</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #35ff8b;
      font-family: 'Courier New', monospace; display: flex; align-items: center;
      justify-content: center; text-align: center; }
    .box { padding: 30px; }
    h1 { letter-spacing: 4px; text-shadow: 0 0 10px rgba(53,255,139,.6); font-size: 20px; }
    p { color: rgba(53,255,139,.7); line-height: 1.6; font-size: 14px; max-width: 320px; }
    button { margin-top: 20px; background: #35ff8b; color: #001a0a; border: none;
      padding: 12px 24px; border-radius: 6px; font: bold 14px 'Courier New'; cursor: pointer;
      box-shadow: 0 0 20px rgba(53,255,139,.4); }
    .scan { position: fixed; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(53,255,139,.04) 3px, transparent 4px); }
  </style>
</head>
<body>
  <div class="scan"></div>
  <div class="box">
    <h1>◈ JARVIS HORS LIGNE</h1>
    <p>La messagerie a besoin que <b>JARVIS soit démarré</b> sur ce PC (serveur sur le port 8090).</p>
    <p>Lancez JARVIS, puis réessayez.</p>
    <button onclick="location.href='#retry'">RÉESSAYER</button>
  </div>
</body>
</html>
